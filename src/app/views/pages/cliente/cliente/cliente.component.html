
<form [formGroup]='form'>
<div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" class="linha-formulario">
  <div class="col-md-6" fxFlex="80" style="margin-left: 16px;">
    <mat-form-field class="input-filtro" fxFlex>
      <mat-label class="label">Pesquisar Cliente</mat-label>
      <input matInput  (keyup)="applyFilter($event)" formControlName="filtro" #input />
    </mat-form-field>
  </div>
  <div class="col" >
    <button mat-button  (click)="limparFiltro()" mat-raised-button fxLayout="row" fxLayoutGap="8px" fxFlex="auto" class="botao-estilo">
      Limpar <mat-icon>backspace</mat-icon>
    </button>
  </div>
  <div class="col">
    <button mat-button (click)="openDialog()" mat-raised-button color="primary" fxFlex="grow" class="botao-adicionar">
      Adicionar <mat-icon>add</mat-icon>
    </button>
  </div>
</div>
</form>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Cliente </th>
      <td mat-cell *matCellDef="let cliente"> {{cliente.nome}} </td>
    </ng-container>

    <ng-container matColumnDef="cpf">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> CPF </th>
      <td mat-cell *matCellDef="let cliente"> {{cliente.cpf | cpf}} </td>
    </ng-container>

    <ng-container matColumnDef="dtNascimento">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Data de Nascimento </th>
      <td mat-cell *matCellDef="let cliente"> {{cliente.dtNascimento | date:'dd/MM/yyyy' }} </td>
    </ng-container>

    <ng-container matColumnDef="telefone">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Telefone </th>
      <td mat-cell *matCellDef="let cliente"> {{cliente.telefone | telefone}} </td>
    </ng-container>

    <ng-container matColumnDef="cep">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> CEP</th>
      <td mat-cell *matCellDef="let cliente"> {{cliente.endereco.cep | cep}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Ações </th>
      <td mat-cell *matCellDef="let cliente" class="icones-acoes">
        <button mat-icon-button (click)="visualizar(cliente)" matTooltip="Visualizar">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button (click)="editar(cliente)">
          <mat-icon color="primary">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="confirmarExclusao(cliente)">
          <mat-icon color="warn">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Selecione uma paginas:"></mat-paginator>
