
<form [formGroup]='form'>
<div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" class="linha-formulario">
  <div class="col-md-6" fxFlex="80" style="margin-left: 16px;">
    <mat-form-field class="input-filtro" appearance="standard" fxFlex>
      <mat-label class="label">Pesquisar Medicos</mat-label>
      <input matInput  (keyup)="applyFilter($event)" formControlName="filtro" #input />
    </mat-form-field>
  </div>
  <div class="col" >
    <button mat-button  (click)="limparFiltro()" mat-raised-button fxLayout="row" fxLayoutGap="8px" fxFlex="auto" class="botao-estilo">
      Limpar <mat-icon>backspace</mat-icon>
    </button>
  </div>
  <div class="col">
    <button  mat-button fxFlex="none">
      <mat-icon class="grade-icon">view_module</mat-icon>
    </button>
  </div>
</div>
</form>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Medico </th>
      <td mat-cell *matCellDef="let medico"> {{medico.nome}} </td>
    </ng-container>

    <ng-container matColumnDef="especialidade">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Especialidade </th>
      <td mat-cell *matCellDef="let medico"> {{medico.especialidade}} </td>
    </ng-container>

    <ng-container matColumnDef="disponibilidade">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Disponibilidade </th>
      <td mat-cell *matCellDef="let medico"> {{medico.disponibilidade}} </td>
    </ng-container>

    <ng-container matColumnDef="telefone">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Telefone </th>
      <td mat-cell *matCellDef="let medico"> {{medico.telefone}} </td>
    </ng-container>

    <ng-container matColumnDef="hrTrabalho">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Hora de Trabalhos</th>
      <td mat-cell *matCellDef="let medico"> {{medico.hrTrabalho}} </td>
    </ng-container>


    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Ações </th>
      <td mat-cell *matCellDef="let cliente" class="icones-acoes">
        <!-- <button mat-icon-button>
          <mat-icon color="primary">edit</mat-icon>
        </button> -->
        <button mat-icon-button (click)="limparDados(cliente)">
          <mat-icon color="warn">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
