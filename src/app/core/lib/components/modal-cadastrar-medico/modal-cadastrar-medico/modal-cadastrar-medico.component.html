<div>
  <div
    class="px-6 py-4 border-b" id="title" fxLayout="row" fxLayoutAlign="start center" >
    <h2 class="title m-0">Novo Medico</h2>
  </div>
  <mat-dialog-content>
    <div @fadeInUp fxFlex="auto" [formGroup]="form">
      <div class="px-6 py-4" fxLayout="column">
        <mat-form-field appearance="legacy" class="full-width">
          <mat-label class="nome">Nome</mat-label>
          <input matInput required formControlName="nome" placeholder='Informe o nome completo:'/>
        </mat-form-field>

        <div class="py-4" fxLayout="column">
          <mat-form-field appearance="legacy" class="full-width">
            <mat-label>CPF</mat-label>
            <input matInput required formControlName="cpf" placeholder='000.000.000-00'/>
          </mat-form-field>
        </div>

        <div fxLayout="row"fxLayout.lt-sm="row"fxLayoutGap="8px"fxLayoutGap.lt-sm="0">
          <mat-form-field appearance="legacy" fxFlex="auto">
            <mat-label>Data de Nascimento</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="dtNascimento" placeholder='01/01/1998'/>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="legacy" fxFlex="auto">
            <mat-label>Sexo</mat-label>
                <mat-select formControlName="sexo">
                    <mat-option>Masculino</mat-option>
                    <mat-option>Feminino</mat-option>
                    <mat-option>Outro</mat-option>
                </mat-select>
          </mat-form-field>
        </div>

        <div class="py-4" fxLayout="column">
          <mat-form-field appearance="legacy" class="full-width">
            <mat-label>Telefone</mat-label>
            <input matInput required formControlName="telefone" placeholder='(00) 90000-0000' />
          </mat-form-field>
        </div>

        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" fxLayoutGap.lt-sm="0">
          <mat-form-field appearance="legacy" fxFlex="auto">
            <mat-label>CEP</mat-label>
            <input matInput required formControlName="cep" placeholder='00000-000' />
          </mat-form-field>
        </div>

        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" fxLayoutGap.lt-sm="0">
            <mat-form-field appearance="legacy" fxFlex="auto">
            <mat-label>Estado</mat-label>
            <input matInput required formControlName="estado" placeholder='Coloque aqui sua estado...' />
          </mat-form-field>

          <mat-form-field appearance="legacy" fxFlex="auto">
            <mat-label>Cidade</mat-label>
            <input matInput required formControlName="cidade" placeholder='Coloque aqui sua cidade...' />
          </mat-form-field>
        </div>

        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" fxLayoutGap.lt-sm="0">
        <mat-form-field appearance="legacy" fxFlex="auto">
            <mat-label>Bairro</mat-label>
            <input matInput required formControlName="bairro" placeholder='Coloque aqui seu bairro...' />
        </mat-form-field>

          <mat-form-field appearance="legacy" fxFlex="auto">
            <mat-label>Complemento</mat-label>
            <input matInput required formControlName="complemento" placeholder='Casa própria ou alugada...' />
          </mat-form-field>
        </div>

        <div fxLayout="row" fxLayout.It-sm="column" fxLayoutGap="8px" fxLayoutGap.lt-sm="0">
          <mat-form-field appearance="legacy" fxFlex="50%">
            <mat-label>Logradouro</mat-label>
            <input matInput required formControlName="logradouro" placeholder='Coloque aqui su rua...' />
          </mat-form-field>

          <mat-form-field appearance="legacy" fxFlex="50%">
            <mat-label>Numero</mat-label>
            <input matInput required formControlName="numero" placeholder='Coloque aqui seu numero...' />
          </mat-form-field>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-button mat-raised-button color="primary" [disabled]="form.invalid"(click)="cadastrar()">Salvar</button>
  </mat-dialog-actions>
</div>
