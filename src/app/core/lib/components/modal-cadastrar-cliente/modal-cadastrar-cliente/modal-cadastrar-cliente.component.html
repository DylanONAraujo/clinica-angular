<div>
  <div class="px-6 py-4 border-b" id="title" fxLayout="row" fxLayoutAlign="start center">
    <h2 class="title m-0">{{ modo === 'visualizar' ? 'Visualizar Cliente': modo === 'editar' ? 'Alteração de dados':'Novo Cliente' }}</h2>
  </div>
  <mat-dialog-content>
    <div @fadeInUp fxFlex="auto" [formGroup]="form">
      <div class="px-6 py-4" fxLayout="column">
        <mat-form-field class="campoesticado">
          <mat-label>Nome</mat-label>
          <input matInput required formControlName="nome" placeholder='Informe o nome completo:' />
        </mat-form-field>

        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" class="linha-formulario">
          <mat-form-field fxFlex="50%">
            <mat-label>CPF</mat-label>
            <input matInput required formControlName="cpf" placeholder='000.000.000-00' mask="000.000.000-00" />
          </mat-form-field>

          <mat-form-field fxFlex="50%">
            <mat-label>Sexo</mat-label>
            <mat-select formControlName="sexo">
              <mat-option value="Masculino">Masculino</mat-option>
              <mat-option value="Feminino">Feminino</mat-option>
              <mat-option value="Outro">Outro</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px">
          <mat-form-field fxFlex="auto">
            <mat-label>Data de Nascimento</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="dtNascimento" placeholder="DD/MM/AAAA"/>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <mat-form-field fxFlex="auto">
            <mat-label>Telefone</mat-label>
            <input matInput required formControlName="telefone" placeholder='(00) 90000-0000' mask="(00) 00000-0000" />
          </mat-form-field>
        </div>

        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" fxLayoutGap.lt-sm="0">
          <mat-form-field class="campoesticado">
            <mat-label>CEP</mat-label>
            <input matInput required formControlName="cep" placeholder='00000-000' (blur)="buscarCep()"
              mask="00000-000" />
          </mat-form-field>
        </div>

        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px">
          <mat-form-field fxFlex="50%">
            <mat-label>Logradouro</mat-label>
            <input matInput formControlName="logradouro" placeholder='Coloque aqui su rua...' />
          </mat-form-field>

          <mat-form-field fxFlex="50%">
            <mat-label>Numero</mat-label>
            <input matInput required formControlName="numero" placeholder='Coloque aqui seu numero...' />
          </mat-form-field>
        </div>


        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" fxLayoutGap.lt-sm="0">

          <mat-form-field fxFlex="auto">
            <mat-label>Complemento</mat-label>
            <input matInput required formControlName="complemento" placeholder='Casa própria ou alugada...' />
          </mat-form-field>

          <mat-form-field fxFlex="auto">
            <mat-label>Bairro</mat-label>
            <input matInput formControlName="bairro" placeholder='Coloque aqui seu bairro...' />
          </mat-form-field>
        </div>


        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="16px" fxLayoutGap.lt-sm="0">
          <mat-form-field fxFlex="auto">
            <mat-label>Cidade</mat-label>
            <input matInput formControlName="cidade" placeholder='Coloque aqui sua cidade...' />
          </mat-form-field>

          <mat-form-field fxFlex="auto">
            <mat-label>Estado</mat-label>
            <input matInput formControlName="estado" placeholder='Coloque aqui sua estado...' />
          </mat-form-field>
        </div>


      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>{{modo === 'visualizar' ? 'Fechar' : 'Cancelar' }}</button>
    <button *ngIf="modo !== 'visualizar'" mat-button mat-raised-button color="primary" [disabled]="form.invalid" (click)="cadastrar()">Salvar</button>
  </mat-dialog-actions>
</div>
